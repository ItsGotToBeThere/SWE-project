<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Notes App Login</title>
  </head>
  <body>
    {% load socialaccount %}
    <a href="{% provider_login_url 'google'%}?next=/">Google Login</a>
    
    {% if user.is_authenticated %}
    <p>You are signed in as {{user.email}}</p>
    <a href="logout">Logout</a>
    {% endif %}
  </body>
</html>
