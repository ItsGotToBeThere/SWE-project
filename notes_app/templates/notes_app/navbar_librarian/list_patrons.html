{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    {% include 'notes_app/messages.html' %}
    <h2>List of Patrons</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Promote</th>
            </tr>
        </thead>
        <tbody>
            {% for patron in patrons %}
            <tr>
                <td>{{ patron.username }}</td>
                <td>{{ patron.email }}</td>
                <td>
                    <form method="post" style="display:inline;">
                        {% csrf_token %}
                        <input type="hidden" name="patron_id" value="{{ patron.id }}">
                        <button type="submit" class="btn btn-sm btn-success">Promote</button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3">No patrons found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
